<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc">
  <title id="title">Kinbot A 档论文调研全景信息图</title>
  <desc id="desc">2026-04-29 至 2026-06-04 每日论文任务中 111 篇 A 或 A- 论文的主题归并与评审结论。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 42px; font-weight: 760; fill: #111827; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 22px; fill: #4b5563; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 19px; fill: #374151; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #4b5563; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 25px; font-weight: 720; fill: #111827; }
      .num { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 58px; font-weight: 800; fill: #111827; }
      .metric { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: 760; fill: #111827; }
      .white { fill: #fff; }
      .line { stroke: #d1d5db; stroke-width: 2; }
      .arrow { stroke: #6b7280; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 650; fill: #111827; }
      .pill-white { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 650; fill: #ffffff; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="1150"/>

  <text class="title" x="70" y="75">Kinbot A 档论文调研全景</text>
  <text class="sub" x="70" y="116">2026-04-29 至 2026-06-04，每日论文任务中 `A / A-` 论文的工程归并视图</text>

  <rect x="70" y="150" width="370" height="220" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <text class="num" x="105" y="235">111</text>
  <text class="card-title" x="105" y="275">A 档及以上论文</text>
  <text class="small" x="105" y="314">严格 A：38 篇</text>
  <text class="small" x="105" y="344">A-：73 篇，A+：0 篇</text>

  <rect x="480" y="150" width="1050" height="220" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <text class="card-title" x="520" y="205">总评审结论</text>
  <text class="small" x="520" y="246">论文证据已足够支撑“验证字段包”建设；不支撑继续扩张在线架构。</text>
  <text class="small" x="520" y="286">主线保持：纯视觉、端侧敏感数据处理、12GB RAM + 32GB Flash、当前 BOM 基线。</text>
  <text class="small" x="520" y="326">下一步：把研究输入压缩为 Phase 5 可测字段、回放场景和审计证据。</text>

  <rect x="70" y="420" width="470" height="180" rx="8" fill="#e6f0ff" filter="url(#shadow)"/>
  <text class="metric" x="105" y="480">34</text>
  <text class="card-title" x="175" y="480">纯视觉导航与定位</text>
  <text class="tiny" x="105" y="525">关键词：RGB-only、SLAM、ObjectNav、VPR、深度不确定性</text>
  <text class="tiny" x="105" y="558">结论：必须带拒绝、重观察、回放和真值对照。</text>

  <rect x="565" y="420" width="470" height="180" rx="8" fill="#ffeceb" filter="url(#shadow)"/>
  <text class="metric" x="600" y="480">28</text>
  <text class="card-title" x="670" y="480">安全治理与运行时门控</text>
  <text class="tiny" x="600" y="525">关键词：置信、拒答、失败提前量、价值冲突、碰撞 grounding</text>
  <text class="tiny" x="600" y="558">结论：成功率必须拆成成功 + 安全 + 审计。</text>

  <rect x="1060" y="420" width="470" height="180" rx="8" fill="#e8f7ef" filter="url(#shadow)"/>
  <text class="metric" x="1095" y="480">15</text>
  <text class="card-title" x="1165" y="480">记忆与世界状态</text>
  <text class="tiny" x="1095" y="525">关键词：选择性写入、场景图、遗忘、对象重获</text>
  <text class="tiny" x="1095" y="558">结论：记忆要有写入理由和保留策略。</text>

  <rect x="70" y="635" width="470" height="180" rx="8" fill="#fff4d6" filter="url(#shadow)"/>
  <text class="metric" x="105" y="695">15</text>
  <text class="card-title" x="175" y="695">验证评测与证据链</text>
  <text class="tiny" x="105" y="740">关键词：benchmark、sim-to-real、诊断、执行前验证</text>
  <text class="tiny" x="105" y="773">结论：Phase 5 要从成功率转向证据包。</text>

  <rect x="565" y="635" width="470" height="180" rx="8" fill="#f0eaff" filter="url(#shadow)"/>
  <text class="metric" x="600" y="695">11</text>
  <text class="card-title" x="670" y="695">端侧资源与平台运行时</text>
  <text class="tiny" x="600" y="740">关键词：XPU、Edge VLM、DAG 调度、量化、MoE、SCOPE</text>
  <text class="tiny" x="600" y="773">结论：只认目标 SoC profiling，不按参数量下注。</text>

  <rect x="1060" y="635" width="470" height="180" rx="8" fill="#e7faf9" filter="url(#shadow)"/>
  <text class="metric" x="1095" y="695">8</text>
  <text class="card-title" x="1165" y="695">交互意图与澄清</text>
  <text class="tiny" x="1095" y="740">关键词：intent、query cost、主动询问、少打扰</text>
  <text class="tiny" x="1095" y="773">结论：问用户要算成本，不能用多问刷成功率。</text>

  <path class="arrow" d="M305 390 C305 400 305 405 305 418"/>
  <path class="arrow" d="M800 390 C800 400 800 405 800 418"/>
  <path class="arrow" d="M1295 390 C1295 400 1295 405 1295 418"/>

  <rect x="170" y="875" width="1260" height="105" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <text class="card-title" x="205" y="928">统一落地形态：Phase 5 验证字段包</text>
  <text class="small" x="205" y="962">visual uncertainty / memory gate / safety confidence / edge profiling / query cost / evidence packet</text>

  <rect x="170" y="1010" width="1260" height="78" rx="8" fill="#111827"/>
  <text class="pill-white" x="205" y="1043">禁止误用：不要把单篇论文升级成新主线；不新增主动传感 fallback、通用 VLA 主控、</text>
  <text class="pill-white" x="205" y="1070">完整数字孪生平台或多套 memory backend。</text>
</svg>
