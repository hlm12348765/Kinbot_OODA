<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180" role="img" aria-labelledby="title desc">
  <title id="title">AgentCell 统一定义、角色用法与内部实现关系视图</title>
  <desc id="desc">SysML v2 GeneralView。展示 AgentCell 统一七元组与递归接口，AgentRoleKind 的五种角色用法，TaskWorker 对 AgentCell 的显式特化，以及 RobotSkill 和控制安全子系统可以包含相应角色 AgentCell 的实现关系。</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#64748B"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#4F79A8"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#32877F"/></marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#C28A1B"/></marker>
    <style>
      text { font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; fill:#182230; }
      .title { font-size:30px; font-weight:700; }
      .subtitle { font-size:15px; fill:#5A6573; }
      .view { font-size:14px; fill:#45515F; }
      .st { font-size:12px; fill:#5A6573; }
      .name { font-size:18px; font-weight:700; }
      .body { font-size:13px; }
      .small { font-size:12px; }
      .typed { fill:none; stroke:#32877F; stroke-width:1.8; stroke-dasharray:7 5; marker-end:url(#arrow-teal); }
      .specializes { fill:none; stroke:#64748B; stroke-width:2; marker-end:url(#arrow-gray); }
      .io { fill:none; stroke:#4F79A8; stroke-width:2; marker-end:url(#arrow-blue); }
      .contains { fill:none; stroke:#C28A1B; stroke-width:2; stroke-dasharray:7 5; marker-end:url(#arrow-gold); }
      .divider { stroke:#CBD5E1; stroke-width:1; }
    </style>
  </defs>

  <rect width="1900" height="1180" fill="#F8FAFC"/>
  <text x="950" y="46" text-anchor="middle" class="title">AgentCell 统一定义、角色用法与内部实现关系视图</text>
  <text x="950" y="76" text-anchor="middle" class="subtitle">角色标记不等于子类型 · TaskWorker具有显式特化约束 · Skill与Control内部可以使用同型AgentCell</text>
  <rect x="40" y="96" width="1820" height="42" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="60" y="123" class="view">view &lt;acgv&gt; 'AgentCell统一定义视图' : GeneralView</text>

  <g>
    <rect x="590" y="175" width="720" height="315" rx="14" fill="#F1EDFA" stroke="#735FA5" stroke-width="2.2"/>
    <text x="950" y="204" text-anchor="middle" class="st">«part def»</text>
    <text x="950" y="236" text-anchor="middle" class="name">AgentCell</text>
    <line x1="590" y1="252" x2="1310" y2="252" class="divider"/>
    <text x="950" y="280" text-anchor="middle" class="body">𝔄ᵢ = (𝒮ᵢ, 𝒳ᵢ, 𝒴ᵢ, 𝒜ᵢ, φᵢ, Mᵢ, Ψᵢ)</text>
    <text x="950" y="306" text-anchor="middle" class="body">同一形式 · 可递归组合 · 对所持契约承担唯一Owner责任</text>
    <text x="950" y="340" text-anchor="middle" class="body">roleKind : AgentRoleKind</text>
    <text x="950" y="366" text-anchor="middle" class="body">subAgents : AgentCell [0..*]　　skills : RobotSkill [0..*]</text>
    <text x="950" y="400" text-anchor="middle" class="body">输入：Observation／Signal／StateRef／MemoryRef／EvidenceRef／Feedback</text>
    <text x="950" y="426" text-anchor="middle" class="body">输出：Result／Evidence／ActionProposal／SkillRequest／SubContractRequest</text>
    <text x="950" y="460" text-anchor="middle" class="small">契约、授权、局部工作状态、角色和生命周期属于属性与约束，不扩充七元组</text>
  </g>

  <g>
    <rect x="70" y="225" width="380" height="210" rx="12" fill="#EAF3FF" stroke="#4F79A8" stroke-width="2"/>
    <text x="260" y="254" text-anchor="middle" class="st">«port group»</text>
    <text x="260" y="286" text-anchor="middle" class="name">统一递归接口</text>
    <line x1="70" y1="302" x2="450" y2="302" class="divider"/>
    <text x="260" y="330" text-anchor="middle" class="body">观察、共享引用与契约输入</text>
    <text x="260" y="356" text-anchor="middle" class="body">结果、候选操作与Skill请求</text>
    <text x="260" y="382" text-anchor="middle" class="body">反馈、干预与下级Agent关系</text>
    <text x="260" y="408" text-anchor="middle" class="small">所有角色使用同一组接口语义</text>
  </g>
  <path d="M450,330 L590,330" class="io"/>
  <text x="520" y="316" text-anchor="middle" class="small">统一接口</text>

  <g>
    <rect x="1450" y="225" width="380" height="210" rx="12" fill="#F3F5F7" stroke="#64748B" stroke-width="2"/>
    <text x="1640" y="254" text-anchor="middle" class="st">«enum def»</text>
    <text x="1640" y="286" text-anchor="middle" class="name">AgentRoleKind</text>
    <line x1="1450" y1="302" x2="1830" y2="302" class="divider"/>
    <text x="1640" y="330" text-anchor="middle" class="body">root · businessDomain · task</text>
    <text x="1640" y="356" text-anchor="middle" class="body">skill · control</text>
    <text x="1640" y="394" text-anchor="middle" class="small">责任分类属性，不构成继承层级</text>
  </g>
  <path d="M1450,330 L1310,330" class="typed"/>
  <text x="1380" y="316" text-anchor="middle" class="small">roleKind</text>

  <text x="950" y="552" text-anchor="middle" class="name">五种 AgentCell 角色用法</text>

  <g>
    <rect x="45" y="585" width="330" height="180" rx="12" fill="#F1EDFA" stroke="#735FA5" stroke-width="2"/>
    <text x="210" y="613" text-anchor="middle" class="st">«part usage»</text>
    <text x="210" y="644" text-anchor="middle" class="name">A0 : AgentCell</text>
    <line x1="45" y1="660" x2="375" y2="660" class="divider"/>
    <text x="210" y="690" text-anchor="middle" class="body">roleKind = root</text>
    <text x="210" y="718" text-anchor="middle" class="body">根任务与用户承诺Owner</text>
    <text x="210" y="744" text-anchor="middle" class="small">普通AgentCell用法，不新增子类型</text>
  </g>

  <g>
    <rect x="415" y="585" width="330" height="180" rx="12" fill="#F1EDFA" stroke="#735FA5" stroke-width="2"/>
    <text x="580" y="613" text-anchor="middle" class="st">«part usage»</text>
    <text x="580" y="644" text-anchor="middle" class="name">businessAgents[4]</text>
    <line x1="415" y1="660" x2="745" y2="660" class="divider"/>
    <text x="580" y="690" text-anchor="middle" class="body">: AgentCell</text>
    <text x="580" y="718" text-anchor="middle" class="body">roleKind = businessDomain</text>
    <text x="580" y="744" text-anchor="middle" class="small">长期基础业务责任Owner</text>
  </g>

  <g>
    <rect x="785" y="570" width="330" height="210" rx="12" fill="#EEEAF8" stroke="#735FA5" stroke-width="2.4"/>
    <text x="950" y="598" text-anchor="middle" class="st">«part def»</text>
    <text x="950" y="629" text-anchor="middle" class="name">TaskWorker</text>
    <line x1="785" y1="645" x2="1115" y2="645" class="divider"/>
    <text x="950" y="675" text-anchor="middle" class="body">specializes AgentCell</text>
    <text x="950" y="703" text-anchor="middle" class="body">roleKind = task</text>
    <text x="950" y="731" text-anchor="middle" class="body">一次有界任务契约Owner</text>
    <text x="950" y="757" text-anchor="middle" class="small">额外约束：完成／失败／取消／回收</text>
  </g>

  <g>
    <rect x="1155" y="585" width="330" height="180" rx="12" fill="#FFF4D8" stroke="#C28A1B" stroke-width="2"/>
    <text x="1320" y="613" text-anchor="middle" class="st">«part usage»</text>
    <text x="1320" y="644" text-anchor="middle" class="name">skillAgents[0..*]</text>
    <line x1="1155" y1="660" x2="1485" y2="660" class="divider"/>
    <text x="1320" y="690" text-anchor="middle" class="body">: AgentCell</text>
    <text x="1320" y="718" text-anchor="middle" class="body">roleKind = skill</text>
    <text x="1320" y="744" text-anchor="middle" class="small">仅拥有执行子契约</text>
  </g>

  <g>
    <rect x="1525" y="585" width="330" height="180" rx="12" fill="#E8F5EC" stroke="#4A9468" stroke-width="2"/>
    <text x="1690" y="613" text-anchor="middle" class="st">«part usage»</text>
    <text x="1690" y="644" text-anchor="middle" class="name">controlAgents[0..*]</text>
    <line x1="1525" y1="660" x2="1855" y2="660" class="divider"/>
    <text x="1690" y="690" text-anchor="middle" class="body">: AgentCell</text>
    <text x="1690" y="718" text-anchor="middle" class="body">roleKind = control</text>
    <text x="1690" y="744" text-anchor="middle" class="small">仅拥有控制或安全子契约</text>
  </g>

  <path d="M210,585 L210,525 L720,525 L720,490" class="typed"/>
  <path d="M580,585 L580,545 L800,545 L800,490" class="typed"/>
  <path d="M950,570 L950,490" class="specializes"/>
  <path d="M1320,585 L1320,545 L1100,545 L1100,490" class="typed"/>
  <path d="M1690,585 L1690,525 L1180,525 L1180,490" class="typed"/>
  <text x="950" y="508" text-anchor="middle" class="small">TaskWorker使用特化；其余为带roleKind的AgentCell用法</text>

  <g>
    <rect x="1020" y="890" width="440" height="190" rx="12" fill="#FFF4D8" stroke="#C28A1B" stroke-width="2"/>
    <text x="1240" y="918" text-anchor="middle" class="st">«interface def»</text>
    <text x="1240" y="950" text-anchor="middle" class="name">RobotSkill</text>
    <line x1="1020" y1="966" x2="1460" y2="966" class="divider"/>
    <text x="1240" y="996" text-anchor="middle" class="body">能力接口，不限定实现</text>
    <text x="1240" y="1024" text-anchor="middle" class="body">算法／模型／服务／状态机／AgentCell</text>
    <text x="1240" y="1052" text-anchor="middle" class="small">内部Agent不能扩大调用者的业务契约</text>
  </g>
  <path d="M1320,765 L1320,890" class="contains"/>
  <text x="1375" y="832" text-anchor="middle" class="small">may be contained in</text>

  <g>
    <rect x="1500" y="890" width="350" height="190" rx="12" fill="#E8F5EC" stroke="#4A9468" stroke-width="2"/>
    <text x="1675" y="918" text-anchor="middle" class="st">«part usage»</text>
    <text x="1675" y="950" text-anchor="middle" class="name">Control／Safety Subsystem</text>
    <line x1="1500" y1="966" x2="1850" y2="966" class="divider"/>
    <text x="1675" y="996" text-anchor="middle" class="body">Controller或F1内部实现边界</text>
    <text x="1675" y="1024" text-anchor="middle" class="body">可以包含control角色AgentCell</text>
    <text x="1675" y="1052" text-anchor="middle" class="small">硬安全仍由确定性机制最终约束</text>
  </g>
  <path d="M1690,765 L1690,890" class="contains"/>
  <text x="1745" y="832" text-anchor="middle" class="small">may be contained in</text>

  <rect x="130" y="1110" width="1640" height="44" rx="9" fill="#EEF6FF" stroke="#6B91BA"/>
  <text x="950" y="1138" text-anchor="middle" class="small">不变量：五种角色共享同一AgentCell形式；角色只改变责任范围，不改变七元组；内部Agent不能取得外层业务契约的所有权</text>
</svg>
