<title id="title">Kinbot L1 单一常驻主 Agent 互连视图</title>
<desc id="desc">方案二的 SysML v2 InterconnectionView：一个常驻 A0 主 Agent，零到多个临时任务子 Agent，以及感知与实时状态、技能与工具、运行、安全授权、机电与硬安全五个非 Agent 系统；P-P1 生成的实时 I1 直接进入 F1。</desc>
