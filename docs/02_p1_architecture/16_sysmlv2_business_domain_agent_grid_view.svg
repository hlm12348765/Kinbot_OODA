<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1100" viewBox="0 0 1900 1100" role="img" aria-labelledby="title desc">
<title id="title">四个基础业务 Agent、TaskWorker 与组织责任视图</title>
<desc id="desc">用表格展开四个基础业务Agent的正式名称、长期责任、典型TaskWorker和唯一组织责任人，说明新增业务Agent的扩展方式。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#7B8794"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#5C86B5"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#B94E56"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#4A9468"/></marker>
  <style>
    text { font-family: "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #182230; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #5A6573; }
    .view { font-size: 14px; fill: #45515F; }
    .st { font-size: 12px; fill: #5A6573; }
    .name { font-size: 18px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .edge { fill: none; stroke: #7B8794; stroke-width: 1.7; marker-end: url(#arrow); }
    .edge-blue { fill: none; stroke: #5C86B5; stroke-width: 1.8; marker-end: url(#arrow-blue); }
    .edge-red { fill: none; stroke: #B94E56; stroke-width: 1.9; marker-end: url(#arrow-red); }
    .edge-green { fill: none; stroke: #4A9468; stroke-width: 1.9; marker-end: url(#arrow-green); }
    .edge-dash { fill: none; stroke: #32877F; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    .divider { stroke: #CBD5E1; stroke-width: 1; }
  </style>
</defs>
<rect width="1900" height="1100" fill="#F8FAFC"/><text x="950" y="42" text-anchor="middle" class="title"><tspan x="950" dy="0">四个基础业务 Agent、TaskWorker 与组织责任视图</tspan></text>
<text x="950" y="68" text-anchor="middle" class="subtitle"><tspan x="950" dy="0">基础业务承担长期责任 · TaskWorker承担具体任务 · RobotSkill复用基础能力</tspan></text>
<rect x="40" y="84" width="1820" height="38" rx="8" fill="#F3F5F7" stroke="#CBD5E1"/>
<text x="58" y="109" text-anchor="start" class="view"><tspan x="58" dy="0">view &lt;bdagv&gt; '基础业务Agent网格视图' : GridView</tspan></text><rect x="45" y="150" width="400" height="72" fill="#F3F5F7" stroke="#CBD5E1" stroke-width="1.5"/><text x="245" y="194" text-anchor="middle" class="name"><tspan x="245" dy="0">基础业务 AgentCell</tspan></text><rect x="450" y="150" width="430" height="72" fill="#F3F5F7" stroke="#CBD5E1" stroke-width="1.5"/><text x="665" y="194" text-anchor="middle" class="name"><tspan x="665" dy="0">长期责任</tspan></text><rect x="885" y="150" width="605" height="72" fill="#F3F5F7" stroke="#CBD5E1" stroke-width="1.5"/><text x="1187.5" y="194" text-anchor="middle" class="name"><tspan x="1187.5" dy="0">典型 TaskWorker（运行时）</tspan></text><rect x="1495" y="150" width="360" height="72" fill="#F3F5F7" stroke="#CBD5E1" stroke-width="1.5"/><text x="1675" y="194" text-anchor="middle" class="name"><tspan x="1675" dy="0">AccountableOwner</tspan></text><rect x="45" y="222" width="400" height="195" fill="#F1EDFA" stroke="#735FA5" stroke-width="1.5"/><rect x="450" y="222" width="430" height="195" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><rect x="885" y="222" width="605" height="195" fill="#FFF4D8" stroke="#CBD5E1" stroke-width="1.5"/><rect x="1495" y="222" width="360" height="195" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="245" y="267" text-anchor="middle" class="name"><tspan x="245" dy="0">健康与照护</tspan></text><text x="245" y="298" text-anchor="middle" class="body"><tspan x="245" dy="0">Health and Care</tspan></text><text x="245" y="330" text-anchor="middle" class="small"><tspan x="245" dy="0">«enumeration» HealthAndCare</tspan></text><text x="245" y="366" text-anchor="middle" class="st"><tspan x="245" dy="0">AgentCell</tspan></text><text x="665" y="290" text-anchor="middle" class="body"><tspan x="665" dy="0">健康事件、用药、提醒升级</tspan><tspan x="665" dy="25">服务跟踪、责任交接与恢复</tspan></text><text x="910" y="270" text-anchor="start" class="body"><tspan x="910" dy="0">• MedicationTaskWorker</tspan><tspan x="910" dy="34">• HealthFollowUpTaskWorker</tspan><tspan x="910" dy="34">• EmergencyResponseTaskWorker</tspan></text><text x="1675" y="300" text-anchor="middle" class="body"><tspan x="1675" dy="0">健康与照护</tspan><tspan x="1675" dy="25">业务责任人</tspan></text><text x="1675" y="370" text-anchor="middle" class="small"><tspan x="1675" dy="0">唯一责任人，不等于独立团队</tspan></text><rect x="45" y="417" width="400" height="195" fill="#F1EDFA" stroke="#735FA5" stroke-width="1.5"/><rect x="450" y="417" width="430" height="195" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><rect x="885" y="417" width="605" height="195" fill="#FFF4D8" stroke="#CBD5E1" stroke-width="1.5"/><rect x="1495" y="417" width="360" height="195" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="245" y="462" text-anchor="middle" class="name"><tspan x="245" dy="0">陪伴与关系</tspan></text><text x="245" y="493" text-anchor="middle" class="body"><tspan x="245" dy="0">Companionship and Relationship</tspan></text><text x="245" y="525" text-anchor="middle" class="small"><tspan x="245" dy="0">«enumeration» CompanionshipAndRelationship</tspan></text><text x="245" y="561" text-anchor="middle" class="st"><tspan x="245" dy="0">AgentCell</tspan></text><text x="665" y="485" text-anchor="middle" class="body"><tspan x="665" dy="0">长期关系、偏好、礼仪</tspan><tspan x="665" dy="25">低打扰节奏与关系修复</tspan></text><text x="910" y="465" text-anchor="start" class="body"><tspan x="910" dy="0">• ConversationTaskWorker</tspan><tspan x="910" dy="34">• ActivityCompanionTaskWorker</tspan><tspan x="910" dy="34">• RelationshipRepairTaskWorker</tspan></text><text x="1675" y="495" text-anchor="middle" class="body"><tspan x="1675" dy="0">陪伴与关系</tspan><tspan x="1675" dy="25">业务责任人</tspan></text><text x="1675" y="565" text-anchor="middle" class="small"><tspan x="1675" dy="0">唯一责任人，不等于独立团队</tspan></text><rect x="45" y="612" width="400" height="195" fill="#F1EDFA" stroke="#735FA5" stroke-width="1.5"/><rect x="450" y="612" width="430" height="195" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><rect x="885" y="612" width="605" height="195" fill="#FFF4D8" stroke="#CBD5E1" stroke-width="1.5"/><rect x="1495" y="612" width="360" height="195" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="245" y="657" text-anchor="middle" class="name"><tspan x="245" dy="0">家庭安全</tspan></text><text x="245" y="688" text-anchor="middle" class="body"><tspan x="245" dy="0">Home Safety</tspan></text><text x="245" y="720" text-anchor="middle" class="small"><tspan x="245" dy="0">«enumeration» HomeSafety</tspan></text><text x="245" y="756" text-anchor="middle" class="st"><tspan x="245" dy="0">AgentCell</tspan></text><text x="665" y="680" text-anchor="middle" class="body"><tspan x="665" dy="0">巡护、异常确认、告警升级</tspan><tspan x="665" dy="25">家庭风险规则与恢复</tspan></text><text x="910" y="660" text-anchor="start" class="body"><tspan x="910" dy="0">• PatrolTaskWorker</tspan><tspan x="910" dy="34">• RiskConfirmationTaskWorker</tspan><tspan x="910" dy="34">• AlertEscalationTaskWorker</tspan></text><text x="1675" y="690" text-anchor="middle" class="body"><tspan x="1675" dy="0">家庭安全</tspan><tspan x="1675" dy="25">业务责任人</tspan></text><text x="1675" y="760" text-anchor="middle" class="small"><tspan x="1675" dy="0">唯一责任人，不等于独立团队</tspan></text><rect x="45" y="807" width="400" height="195" fill="#F1EDFA" stroke="#735FA5" stroke-width="1.5"/><rect x="450" y="807" width="430" height="195" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><rect x="885" y="807" width="605" height="195" fill="#FFF4D8" stroke="#CBD5E1" stroke-width="1.5"/><rect x="1495" y="807" width="360" height="195" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="245" y="852" text-anchor="middle" class="name"><tspan x="245" dy="0">环境与物品</tspan></text><text x="245" y="883" text-anchor="middle" class="body"><tspan x="245" dy="0">Environment and Objects</tspan></text><text x="245" y="915" text-anchor="middle" class="small"><tspan x="245" dy="0">«enumeration» EnvironmentAndObjects</tspan></text><text x="245" y="951" text-anchor="middle" class="st"><tspan x="245" dy="0">AgentCell</tspan></text><text x="665" y="875" text-anchor="middle" class="body"><tspan x="665" dy="0">家庭环境、地点、对象记忆</tspan><tspan x="665" dy="25">找物、熟悉环境与物品运送</tspan></text><text x="910" y="855" text-anchor="start" class="body"><tspan x="910" dy="0">• FindTaskWorker</tspan><tspan x="910" dy="34">• EnvironmentFamiliarizationTaskWorker</tspan><tspan x="910" dy="34">• DeliveryTaskWorker</tspan></text><text x="1675" y="885" text-anchor="middle" class="body"><tspan x="1675" dy="0">环境与物品</tspan><tspan x="1675" dy="25">业务责任人</tspan></text><text x="1675" y="955" text-anchor="middle" class="small"><tspan x="1675" dy="0">唯一责任人，不等于独立团队</tspan></text><rect x="45" y="1012" width="1810" height="54" rx="9" fill="#E6F6F4" stroke="#32877F" stroke-width="1.5"/><text x="950" y="1045" text-anchor="middle" class="body"><tspan x="950" dy="0">新增长期业务 Agent 必须同时满足七项基础业务判定；否则默认实现为 TaskWorker、Workflow 或 RobotSkill。</tspan></text></svg>
