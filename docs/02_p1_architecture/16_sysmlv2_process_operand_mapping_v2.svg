    <text class="compartment" x="1445" y="1980">parameters</text>
    <text class="parameter" x="1063" y="2028">in  状态与上下文 : I3</text>
    <text class="parameter" x="1063" y="2070">in  安全与授权决定 : I5</text>
    <text class="parameter" x="1063" y="2112">in  能力调用与执行状态 : I6</text>
    <text class="parameter" x="1063" y="2154">out 结果与信息输出 : I7</text>
  </g>

  <g aria-label="I-P7">
    <rect class="member" x="150" y="2300" width="820" height="410"/>
    <text class="kind" x="560" y="2345">«action def»</text>
    <text class="name" x="560" y="2390">&lt;I-P7&gt; 验证结果并维持连续性</text>
    <line class="divider" x1="150" y1="2420" x2="970" y2="2420"/>
    <text class="compartment" x="560" y="2460">parameters</text>
    <text class="parameter" x="178" y="2508">in  观察与事件 : I2</text>
    <text class="parameter" x="178" y="2550">in  能力调用与执行状态 : I6</text>
    <text class="parameter" x="178" y="2592">in  当前结果 : I7</text>
    <text class="parameter" x="178" y="2634">out 结果与状态变化 : I7</text>
  </g>

  <g aria-label="I-P8">
    <rect class="member" x="1035" y="2300" width="820" height="410"/>
    <text class="kind" x="1445" y="2345">«action def»</text>
    <text class="name" x="1445" y="2390">&lt;I-P8&gt; 管理运行资源与更新</text>
    <line class="divider" x1="1035" y1="2420" x2="1855" y2="2420"/>
    <text class="compartment" x="1445" y="2460">parameters</text>
    <text class="parameter" x="1063" y="2508">in  资源政策 : I1</text>
    <text class="parameter" x="1063" y="2550">in  资源需求 : I6</text>
