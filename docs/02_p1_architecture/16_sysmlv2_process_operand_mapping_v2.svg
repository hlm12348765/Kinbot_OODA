    <text class="parameter" x="2908" y="1068">in  能量与热状态 : P2</text>
    <text class="parameter" x="2908" y="1110">in  运行资源与版本状态 : I8</text>
    <text class="parameter" x="2908" y="1152">out 受控能量与热状态 : P2</text>
  </g>

  <g aria-label="P-P3">
    <rect class="member" x="2010" y="1480" width="820" height="570"/>
    <text class="kind" x="2420" y="1525">«action def»</text>
    <text class="name" x="2420" y="1570">&lt;P-P3&gt; 执行机器人行为</text>
    <line class="divider" x1="2010" y1="1600" x2="2830" y2="1600"/>
    <text class="compartment" x="2420" y="1640">parameters</text>
    <text class="parameter" x="2038" y="1688">in  安全与授权决定 : I5</text>
    <text class="parameter" x="2038" y="1730">in  能力调用与执行状态 : I6</text>
    <text class="parameter" x="2038" y="1772">in  能量与热状态 : P2</text>
    <text class="parameter" x="2038" y="1814">out 机器人行为与作用 : P3</text>
    <text class="parameter" x="2038" y="1856">out 物理状态变化与反馈 : P5</text>
  </g>

  <g aria-label="P-P4">
    <rect class="member" x="2880" y="1480" width="820" height="570"/>
    <text class="kind" x="3290" y="1525">«action def»</text>
