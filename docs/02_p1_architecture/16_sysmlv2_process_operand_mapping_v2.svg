    <text class="parameter" x="178" y="2028">in  目标与行动方案 : I4</text>
    <text class="parameter" x="178" y="2070">in  安全与授权决定 : I5</text>
    <text class="parameter" x="178" y="2112">in  运行资源与版本状态 : I8</text>
    <text class="parameter" x="178" y="2154">out 能力调用与执行状态 : I6</text>
  </g>

  <g aria-label="I-P6">
    <rect class="member" x="1035" y="1820" width="820" height="410"/>
    <text class="kind" x="1445" y="1865">«action def»</text>
    <text class="name" x="1445" y="1910">&lt;I-P6&gt; 执行信息能力</text>
