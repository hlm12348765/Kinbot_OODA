<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="3040" viewBox="0 0 3840 3040" role="img" aria-labelledby="title desc">
  <title id="title">Kinbot SysML v2 过程与操作数匹配</title>
  <desc id="desc">使用 SysML v2 item definition、action definition 和 parameters compartment 表示八个信息空间过程、五个物理空间过程及其输入输出操作数。</desc>
  <style>
    .frame { fill: #ffffff; stroke: #111111; stroke-width: 3; }
    .member { fill: #ffffff; stroke: #111111; stroke-width: 2.5; }
    .divider { stroke: #111111; stroke-width: 2; }
    .tab-text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 30px; font-weight: 500; fill: #111111; }
    .kind { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 27px; font-weight: 400; fill: #111111; text-anchor: middle; }
    .name { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 29px; font-weight: 500; fill: #111111; text-anchor: middle; }
    .compartment { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 25px; font-style: italic; font-weight: 400; fill: #111111; text-anchor: middle; }
    .parameter { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 25px; font-weight: 400; fill: #111111; }
  </style>

  <rect x="0" y="0" width="3840" height="3040" fill="#ffffff"/>

  <!-- Root package -->
  <rect class="frame" x="40" y="100" width="3760" height="2880"/>
  <rect class="frame" x="40" y="40" width="980" height="60"/>
  <text class="tab-text" x="62" y="80">KinbotProcessOperandMapping</text>

  <!-- Operand definitions package -->
  <rect class="frame" x="100" y="210" width="3640" height="480"/>
  <rect class="frame" x="100" y="155" width="310" height="55"/>
  <text class="tab-text" x="122" y="193">Operands</text>

  <g aria-label="Information item definitions">
    <rect class="member" x="140" y="260" width="470" height="145"/>
    <text class="kind" x="375" y="310">«item def»</text>
    <text class="name" x="375" y="365">&lt;I1&gt; 输入与约束</text>

    <rect class="member" x="655" y="260" width="470" height="145"/>
    <text class="kind" x="890" y="310">«item def»</text>
    <text class="name" x="890" y="365">&lt;I2&gt; 观察与事件</text>

    <rect class="member" x="1170" y="260" width="470" height="145"/>
    <text class="kind" x="1405" y="310">«item def»</text>
    <text class="name" x="1405" y="365">&lt;I3&gt; 状态与上下文</text>

    <rect class="member" x="1685" y="260" width="470" height="145"/>
    <text class="kind" x="1920" y="310">«item def»</text>
    <text class="name" x="1920" y="365">&lt;I4&gt; 目标与行动方案</text>

    <rect class="member" x="2200" y="260" width="470" height="145"/>
    <text class="kind" x="2435" y="310">«item def»</text>
    <text class="name" x="2435" y="365">&lt;I5&gt; 安全与授权决定</text>

    <rect class="member" x="2715" y="260" width="470" height="145"/>
    <text class="kind" x="2950" y="310">«item def»</text>
    <text class="name" x="2950" y="365">&lt;I6&gt; 能力调用与执行状态</text>

    <rect class="member" x="3230" y="260" width="470" height="145"/>
    <text class="kind" x="3465" y="310">«item def»</text>
    <text class="name" x="3465" y="365">&lt;I7&gt; 结果与信息输出</text>

    <rect class="member" x="397" y="455" width="470" height="145"/>
    <text class="kind" x="632" y="505">«item def»</text>
    <text class="name" x="632" y="560">&lt;I8&gt; 运行资源与版本状态</text>
  </g>

