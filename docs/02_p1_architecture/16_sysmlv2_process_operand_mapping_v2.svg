    <line class="divider" x1="1035" y1="980" x2="1855" y2="980"/>
    <text class="compartment" x="1445" y="1020">parameters</text>
    <text class="parameter" x="1063" y="1068">in  输入与约束 : I1</text>
    <text class="parameter" x="1063" y="1110">in  观察与事件 : I2</text>
    <text class="parameter" x="1063" y="1152">in  结果与信息输出 : I7</text>
    <text class="parameter" x="1063" y="1194">in  先前状态与上下文 : I3</text>
    <text class="parameter" x="1063" y="1236">out 更新后的状态与上下文 : I3</text>
  </g>

  <g aria-label="I-P3">
    <rect class="member" x="150" y="1340" width="820" height="410"/>
    <text class="kind" x="560" y="1385">«action def»</text>
    <text class="name" x="560" y="1430">&lt;I-P3&gt; 形成目标与行动方案</text>
    <line class="divider" x1="150" y1="1460" x2="970" y2="1460"/>
