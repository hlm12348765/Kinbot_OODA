    <text class="parameter" x="2908" y="1730">in  能力调用与执行状态 : I6</text>
    <text class="parameter" x="2908" y="1772">in  机器人行为与作用 : P3</text>
    <text class="parameter" x="2908" y="1814">in  物质与载荷 : P4</text>
    <text class="parameter" x="2908" y="1856">out 更新后的物质与载荷 : P4</text>
    <text class="parameter" x="2908" y="1898">out 物理状态变化与反馈 : P5</text>
  </g>

  <g aria-label="P-P5">
    <rect class="member" x="2445" y="2100" width="820" height="570"/>
    <text class="kind" x="2855" y="2145">«action def»</text>
