    <rect class="member" x="912" y="455" width="470" height="145"/>
    <text class="kind" x="1147" y="505">«item def»</text>
    <text class="name" x="1147" y="560">&lt;P1&gt; 可感知物理现象</text>

    <rect class="member" x="1427" y="455" width="470" height="145"/>
