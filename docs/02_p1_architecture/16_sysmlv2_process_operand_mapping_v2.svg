    <rect class="member" x="2972" y="455" width="470" height="145"/>
    <text class="kind" x="3207" y="505">«item def»</text>
    <text class="name" x="3207" y="560">&lt;P5&gt; 物理状态变化与反馈</text>
  </g>

  <!-- Information-space action definitions package -->
  <rect class="frame" x="100" y="800" width="1820" height="2090"/>
  <rect class="frame" x="100" y="745" width="420" height="55"/>
  <text class="tab-text" x="122" y="783">信息空间过程</text>

  <g aria-label="I-P1">
    <rect class="member" x="150" y="860" width="820" height="410"/>
    <text class="kind" x="560" y="905">«action def»</text>
    <text class="name" x="560" y="950">&lt;I-P1&gt; 形成并校验观察</text>
    <line class="divider" x1="150" y1="980" x2="970" y2="980"/>
    <text class="compartment" x="560" y="1020">parameters</text>
    <text class="parameter" x="178" y="1068">in  传感 / 消息 / 事件输入 : I1</text>
    <text class="parameter" x="178" y="1110">out 观察与事件 : I2</text>
  </g>

  <g aria-label="I-P2">
    <rect class="member" x="1035" y="860" width="820" height="410"/>
    <text class="kind" x="1445" y="905">«action def»</text>
