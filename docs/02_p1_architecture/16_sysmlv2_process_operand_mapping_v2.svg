    <text class="compartment" x="2855" y="2260">parameters</text>
    <text class="parameter" x="2473" y="2308">in  安全传感信号 : P1</text>
    <text class="parameter" x="2473" y="2350">in  能量与热状态 : P2</text>
    <text class="parameter" x="2473" y="2392">in  当前机器人行为 : P3</text>
    <text class="parameter" x="2473" y="2434">in  当前物理状态 : P5</text>
    <text class="parameter" x="2473" y="2476">out 受限机器人行为 : P3</text>
    <text class="parameter" x="2473" y="2518">out 安全物理状态 : P5</text>
    <text class="parameter" x="2473" y="2560">out 安全证据 : I7</text>
