    <text class="parameter" x="178" y="1548">in  输入与约束 : I1</text>
    <text class="parameter" x="178" y="1590">in  状态与上下文 : I3</text>
    <text class="parameter" x="178" y="1632">out 目标与行动方案 : I4</text>
  </g>

  <g aria-label="I-P4">
    <rect class="member" x="1035" y="1340" width="820" height="410"/>
    <text class="kind" x="1445" y="1385">«action def»</text>
    <text class="name" x="1445" y="1430">&lt;I-P4&gt; 评估风险并授权行动</text>
    <line class="divider" x1="1035" y1="1460" x2="1855" y2="1460"/>
    <text class="compartment" x="1445" y="1500">parameters</text>
    <text class="parameter" x="1063" y="1548">in  输入与约束 : I1</text>
    <text class="parameter" x="1063" y="1590">in  状态与上下文 : I3</text>
    <text class="parameter" x="1063" y="1632">in  目标与行动方案 : I4</text>
    <text class="parameter" x="1063" y="1674">out 安全与授权决定 : I5</text>
  </g>

  <g aria-label="I-P5">
    <rect class="member" x="150" y="1820" width="820" height="410"/>
    <text class="kind" x="560" y="1865">«action def»</text>
