<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3800" height="2000" viewBox="0 0 3800 2000" role="img" aria-labelledby="title desc">
<title id="title">Kinbot OODA 跨空间行动流视图</title>
<desc id="desc">信息空间、Agentic Robot System 与物理空间之间的观察—定向—决策—行动—反馈闭环</desc>
<defs>
<marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#2F6FDD"/></marker>
<marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#6B57A5"/></marker>
<marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#38815B"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#D97706"/></marker>
<marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#C2413B"/></marker>
<marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#0F766E"/></marker>
<marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#5A6573"/></marker>
</defs>
<style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#182230}
.title{font-size:42px;font-weight:500}.subtitle{font-size:24px;fill:#5A6573}
.view{font-size:22px;fill:#45515F}.zone{font-size:28px;font-weight:500}
.kind{font-size:20px;fill:#5A6573}.name{font-size:27px;font-weight:500}
.body{font-size:22px}.small{font-size:19px;fill:#5A6573}.edge{font-size:20px;font-weight:500}
.node{stroke-width:2.4}.lane{stroke-width:2}.flow{fill:none;stroke-width:3.4}
.thin{fill:none;stroke-width:2.2}.dash{stroke-dasharray:12 9}
.lifeline{stroke:#98A3AF;stroke-width:2.2;stroke-dasharray:9 9}
.activation{fill:#E9E1FF;stroke:#6B57A5;stroke-width:2}
</style>
<rect width="3800" height="2000" fill="#F8FAFC"/>
<text class="title" x="1900.0" y="62" text-anchor="middle">Kinbot OODA 跨空间行动流视图</text>
<text class="subtitle" x="1900.0" y="105" text-anchor="middle">信息空间、Agentic Robot System 与物理空间之间的观察—定向—决策—行动—反馈闭环</text>
