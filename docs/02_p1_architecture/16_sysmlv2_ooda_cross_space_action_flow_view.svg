<g class="action-node"><rect class="node" x="2140" y="600" width="340" height="190" rx="28" fill="#E9E1FF" stroke="#6B57A5"/><text class="kind" x="2310.0" y="634" text-anchor="middle">«action»</text><text class="name" x="2310.0" y="676" text-anchor="middle">Act</text><text class="small" x="2310.0" y="712" text-anchor="middle"><tspan x="2310.0" dy="0">I-P6 / P-P3 / P-P4</tspan></text></g>
<g class="action-node"><rect class="node" x="2560" y="600" width="400" height="190" rx="28" fill="#E9E1FF" stroke="#6B57A5"/><text class="kind" x="2760.0" y="634" text-anchor="middle">«action»</text><text class="name" x="2760.0" y="676" text-anchor="middle">Feedback</text><text class="small" x="2760.0" y="712" text-anchor="middle"><tspan x="2760.0" dy="0">I-P7：验证与更新</tspan></text></g>
