<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="4400" height="2800" viewBox="0 0 4400 2800" role="img" aria-labelledby="title desc">
<title id="title">Kinbot L1 主 Agent 与专业 Agent 互连视图</title>
<desc id="desc">展示信息空间、A0 主 Agent、A1 到 A3 专业 Agent、A4 独立安全与授权 Agent、AP1 Agent 运行平台、F1 机器人机电与硬安全平台以及物理空间之间的主干连接，并明确 P-P1 生成的实时 I1 直接进入 F1。</desc>
<defs>
  <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#6B57A5"/></marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#2F6FDD"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#38815B"/></marker>
  <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#D97706"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#C2413B"/></marker>
  <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#0F766E"/></marker>
</defs>
<style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#182230}
.title{font-size:42px;font-weight:600}.subtitle{font-size:24px;fill:#5A6573}.view{font-size:22px;fill:#45515F}
.zone{font-size:28px;font-weight:600}.kind{font-size:20px;fill:#5A6573}.name{font-size:28px;font-weight:600}
.body{font-size:22px}.small{font-size:19px;fill:#5A6573}.edge{font-size:19px;font-weight:500}
.node{stroke-width:2.5}.lane{stroke-width:2}.flow{fill:none;stroke-width:3.2}.thin{fill:none;stroke-width:2.4}.dash{stroke-dasharray:12 9}
</style>
<rect width="4400" height="2800" fill="#F8FAFC"/>
<text id="titleText" class="title" x="2200" y="62" text-anchor="middle">Kinbot L1 主 Agent 与专业 Agent 互连视图</text>
<text class="subtitle" x="2200" y="105" text-anchor="middle">一个主业务规划中心 · 三个专业 Agent · 一个独立安全 Agent · 两个非 Agent 平台</text>
<rect x="70" y="132" width="4260" height="52" rx="12" fill="#EEF2F7" stroke="#CBD4DE"/>
<text class="view" x="95" y="166">view &lt;l1iv&gt; 'L1主Agent与专业Agent互连视图' : InterconnectionView</text>

<rect class="lane" x="60" y="230" width="720" height="2400" rx="24" fill="#F2F7FD" stroke="#7AA7D9"/>
<rect class="lane" x="820" y="230" width="2760" height="2400" rx="24" fill="#F7F4FC" stroke="#8070A5"/>
