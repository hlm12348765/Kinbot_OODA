<g><rect class="node" x="970" y="760" width="720" height="250" rx="14" fill="#E9E1FF" stroke="#6B57A5"/><text class="kind" x="1330" y="796" text-anchor="middle">«part usage : AgentCell»</text><text class="name" x="1330" y="843" text-anchor="middle">A1 感知与状态理解 Agent</text><line x1="970" y1="867" x2="1690" y2="867" stroke="#6B57A5"/><text class="body" x="1330" y="905" text-anchor="middle"><tspan x="1330">Observe + Orient</tspan><tspan x="1330" dy="31">状态语义与证据质量</tspan></text></g>
<g><rect class="node" x="1840" y="760" width="720" height="250" rx="14" fill="#E9E1FF" stroke="#6B57A5"/><text class="kind" x="2200" y="796" text-anchor="middle">«part usage : AgentCell»</text><text class="name" x="2200" y="843" text-anchor="middle">A2 照护服务 Agent</text><line x1="1840" y1="867" x2="2560" y2="867" stroke="#6B57A5"/><text class="body" x="2200" y="905" text-anchor="middle"><tspan x="2200">健康 · 用药 · 家庭安全</tspan><tspan x="2200" dy="31">外部服务与责任交接</tspan></text></g>
<g><rect class="node" x="2710" y="760" width="720" height="250" rx="14" fill="#E9E1FF" stroke="#6B57A5"/><text class="kind" x="3070" y="796" text-anchor="middle">«part usage : AgentCell»</text><text class="name" x="3070" y="843" text-anchor="middle">A3 机器人行动 Agent</text><line x1="2710" y1="867" x2="3430" y2="867" stroke="#6B57A5"/><text class="body" x="3070" y="905" text-anchor="middle"><tspan x="3070">导航 · 运动 · 递送 · 回充</tspan><tspan x="3070" dy="31">局部规划与物理恢复</tspan></text></g>

<g><rect class="node" x="1650" y="1180" width="1100" height="230" rx="14" fill="#FFF0E4" stroke="#C2413B"/><text class="kind" x="2200" y="1216" text-anchor="middle">«part usage : AgentCell»</text><text class="name" x="2200" y="1263" text-anchor="middle">A4 安全与授权 Agent</text><line x1="1650" y1="1287" x2="2750" y2="1287" stroke="#C2413B"/><text class="body" x="2200" y="1325" text-anchor="middle">风险 · 许可 · 撤销 · 隐私 · 紧急例外</text></g>

<g><rect class="node" x="1120" y="1600" width="2160" height="260" rx="14" fill="#E4F1FA" stroke="#3B6EA8"/><text class="kind" x="2200" y="1636" text-anchor="middle">«part usage : NonAgentPlatform»</text><text class="name" x="2200" y="1683" text-anchor="middle">AP1 Agent 运行平台</text><line x1="1120" y1="1707" x2="3280" y2="1707" stroke="#3B6EA8"/><text class="body" x="2200" y="1745" text-anchor="middle"><tspan x="2200">状态与任务存储 · 事件 · 模型 · 技能 · 连接器</tspan><tspan x="2200" dy="31">资源调度 · 可观测 · 更新；不是 Agent</tspan></text></g>
<g><rect class="node" x="1120" y="2100" width="2160" height="300" rx="14" fill="#FFE7CF" stroke="#B8661E"/><text class="kind" x="2200" y="2136" text-anchor="middle">«part usage : NonAgentPlatform»</text><text class="name" x="2200" y="2183" text-anchor="middle">F1 机器人机电与硬安全平台</text><line x1="1120" y1="2207" x2="3280" y2="2207" stroke="#B8661E"/><text class="body" x="2200" y="2245" text-anchor="middle"><tspan x="2200">传感器 · 执行器 · 驱动 · 控制器 · 电源</tspan><tspan x="2200" dy="31">独立硬安全内核；不是 Agent</tspan></text></g>

