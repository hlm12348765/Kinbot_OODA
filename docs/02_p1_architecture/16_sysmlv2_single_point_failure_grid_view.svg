<svg xmlns="http://www.w3.org/2000/svg" width="2050" height="1390" viewBox="0 0 2050 1390" role="img" aria-labelledby="title desc">
<title id="title">当前 L1 架构单点失效、故障传播与阻断边界视图</title>
<desc id="desc">用九个失效场景检验A0、O3、AP3、G3、RobotSkill、共享模型、CoordinationGraph、F1和共同部署的故障传播是否被限制在明确范围内。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#7B8794"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#5C86B5"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#B94E56"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#4A9468"/></marker>
  <style>
    text { font-family: "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #182230; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #5A6573; }
    .view { font-size: 14px; fill: #45515F; }
    .st { font-size: 12px; fill: #5A6573; }
    .name { font-size: 18px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .edge { fill: none; stroke: #7B8794; stroke-width: 1.7; marker-end: url(#arrow); }
    .edge-blue { fill: none; stroke: #5C86B5; stroke-width: 1.8; marker-end: url(#arrow-blue); }
    .edge-red { fill: none; stroke: #B94E56; stroke-width: 1.9; marker-end: url(#arrow-red); }
    .edge-green { fill: none; stroke: #4A9468; stroke-width: 1.9; marker-end: url(#arrow-green); }
    .edge-dash { fill: none; stroke: #32877F; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    .divider { stroke: #CBD5E1; stroke-width: 1; }
  </style>
</defs>
<rect width="2050" height="1390" fill="#F8FAFC"/><text x="1025" y="42" text-anchor="middle" class="title"><tspan x="1025" dy="0">当前 L1 架构单点失效、故障传播与阻断边界视图</tspan></text>
<text x="1025" y="68" text-anchor="middle" class="subtitle"><tspan x="1025" dy="0">基础业务承担长期责任 · TaskWorker承担具体任务 · RobotSkill复用基础能力</tspan></text>
<rect x="40" y="84" width="1970" height="38" rx="8" fill="#F3F5F7" stroke="#CBD5E1"/>
<text x="58" y="109" text-anchor="start" class="view"><tspan x="58" dy="0">view &lt;spfgv&gt; '单点失效与阻断边界视图' : GridView</tspan></text><rect x="40" y="145" width="210" height="65" fill="#F3F5F7" stroke="#CBD5E1" stroke-width="1.5"/><text x="145" y="185" text-anchor="middle" class="name"><tspan x="145" dy="0">单点候选</tspan></text><rect x="255" y="145" width="585" height="65" fill="#F3F5F7" stroke="#CBD5E1" stroke-width="1.5"/><text x="547.5" y="185" text-anchor="middle" class="name"><tspan x="547.5" dy="0">最致命反例</tspan></text><rect x="845" y="145" width="650" height="65" fill="#F3F5F7" stroke="#CBD5E1" stroke-width="1.5"/><text x="1170" y="185" text-anchor="middle" class="name"><tspan x="1170" dy="0">阻断边界</tspan></text><rect x="1500" y="145" width="510" height="65" fill="#F3F5F7" stroke="#CBD5E1" stroke-width="1.5"/><text x="1755" y="185" text-anchor="middle" class="name"><tspan x="1755" dy="0">通过信号</tspan></text><rect x="40" y="210" width="210" height="123" fill="#FDECEC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="255" y="210" width="585" height="123" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="845" y="210" width="650" height="123" fill="#E6F6F4" stroke="#CBD5E1" stroke-width="1.2"/><rect x="1500" y="210" width="510" height="123" fill="#EAF7EE" stroke="#CBD5E1" stroke-width="1.2"/><text x="145" y="278" text-anchor="middle" class="name"><tspan x="145" dy="0">A0</tspan></text><text x="275" y="264" text-anchor="start" class="body"><tspan x="275" dy="0">主动健康任务授权前崩溃</tspan></text><text x="865" y="252" text-anchor="start" class="body"><tspan x="865" dy="0">已有低风险TaskWorker租约内收尾；</tspan><tspan x="865" dy="21">新主动任务停止；</tspan><tspan x="865" dy="21">预定义紧急契约限权</tspan></text><text x="1755" y="268" text-anchor="middle" class="body"><tspan x="1755" dy="0">无新主动外部影响</tspan></text><rect x="40" y="333" width="210" height="123" fill="#FDECEC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="255" y="333" width="585" height="123" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="845" y="333" width="650" height="123" fill="#E6F6F4" stroke="#CBD5E1" stroke-width="1.2"/><rect x="1500" y="333" width="510" height="123" fill="#EAF7EE" stroke="#CBD5E1" stroke-width="1.2"/><text x="145" y="401" text-anchor="middle" class="name"><tspan x="145" dy="0">O3</tspan></text><text x="275" y="387" text-anchor="start" class="body"><tspan x="275" dy="0">错误身份或位置被所有Agent采用</tspan></text><text x="865" y="375" text-anchor="start" class="body"><tspan x="865" dy="0">证据、版本、新鲜度；</tspan><tspan x="865" dy="21">高风险重新观察；</tspan><tspan x="865" dy="21">局部Skill安全停止</tspan></text><text x="1755" y="391" text-anchor="middle" class="body"><tspan x="1755" dy="0">陈旧状态不启动新动作</tspan></text><rect x="40" y="456" width="210" height="123" fill="#FDECEC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="255" y="456" width="585" height="123" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="845" y="456" width="650" height="123" fill="#E6F6F4" stroke="#CBD5E1" stroke-width="1.2"/><rect x="1500" y="456" width="510" height="123" fill="#EAF7EE" stroke="#CBD5E1" stroke-width="1.2"/><text x="145" y="524" text-anchor="middle" class="name"><tspan x="145" dy="0">AP3</tspan></text><text x="275" y="510" text-anchor="start" class="body"><tspan x="275" dy="0">重启后新旧TaskWorker同时执行</tspan></text><text x="865" y="498" text-anchor="start" class="body"><tspan x="865" dy="0">WorkerLease、fencingToken、单调版本；</tspan><tspan x="865" dy="21">无法确认时F1停止</tspan></text><text x="1755" y="514" text-anchor="middle" class="body"><tspan x="1755" dy="0">同一执行器只有一个Owner</tspan></text><rect x="40" y="579" width="210" height="123" fill="#FDECEC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="255" y="579" width="585" height="123" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="845" y="579" width="650" height="123" fill="#E6F6F4" stroke="#CBD5E1" stroke-width="1.2"/><rect x="1500" y="579" width="510" height="123" fill="#EAF7EE" stroke="#CBD5E1" stroke-width="1.2"/><text x="145" y="647" text-anchor="middle" class="name"><tspan x="145" dy="0">G3</tspan></text><text x="275" y="633" text-anchor="start" class="body"><tspan x="275" dy="0">失效后全放行或永久全拒绝</tspan></text><text x="865" y="621" text-anchor="start" class="body"><tspan x="865" dy="0">低风险短许可；</tspan><tspan x="865" dy="21">高风险默认拒绝；</tspan><tspan x="865" dy="21">恢复后撤销旧PermitLease</tspan></text><text x="1755" y="637" text-anchor="middle" class="body"><tspan x="1755" dy="0">不存在fail-open</tspan></text><rect x="40" y="702" width="210" height="123" fill="#FDECEC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="255" y="702" width="585" height="123" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="845" y="702" width="650" height="123" fill="#E6F6F4" stroke="#CBD5E1" stroke-width="1.2"/><rect x="1500" y="702" width="510" height="123" fill="#EAF7EE" stroke="#CBD5E1" stroke-width="1.2"/><text x="145" y="770" text-anchor="middle" class="name"><tspan x="145" dy="0">RobotSkill</tspan></text><text x="275" y="756" text-anchor="start" class="body"><tspan x="275" dy="0">Navigation崩溃拖垮所有业务</tspan></text><text x="865" y="744" text-anchor="start" class="body"><tspan x="865" dy="0">Skill故障隔离；</tspan><tspan x="865" dy="21">F1制动；</tspan><tspan x="865" dy="21">相关任务失败，其他业务继续</tspan></text><text x="1755" y="760" text-anchor="middle" class="body"><tspan x="1755" dy="0">故障不越过能力边界</tspan></text><rect x="40" y="825" width="210" height="123" fill="#FDECEC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="255" y="825" width="585" height="123" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="845" y="825" width="650" height="123" fill="#E6F6F4" stroke="#CBD5E1" stroke-width="1.2"/><rect x="1500" y="825" width="510" height="123" fill="#EAF7EE" stroke="#CBD5E1" stroke-width="1.2"/><text x="145" y="893" text-anchor="middle" class="name"><tspan x="145" dy="0">共享模型</tspan></text><text x="275" y="879" text-anchor="start" class="body"><tspan x="275" dy="0">OOM使全部Agent和Worker一起失效</tspan></text><text x="865" y="867" text-anchor="start" class="body"><tspan x="865" dy="0">配额、超时、优先级、隔离和确定性降级</tspan></text><text x="1755" y="883" text-anchor="middle" class="body"><tspan x="1755" dy="0">基本停止与硬安全独立</tspan></text><rect x="40" y="948" width="210" height="123" fill="#FDECEC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="255" y="948" width="585" height="123" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="845" y="948" width="650" height="123" fill="#E6F6F4" stroke="#CBD5E1" stroke-width="1.2"/><rect x="1500" y="948" width="510" height="123" fill="#EAF7EE" stroke="#CBD5E1" stroke-width="1.2"/><text x="145" y="1016" text-anchor="middle" class="name"><tspan x="145" dy="0">CoordinationGraph</tspan></text><text x="275" y="1002" text-anchor="start" class="body"><tspan x="275" dy="0">循环委派耗尽任务队列</tspan></text><text x="865" y="990" text-anchor="start" class="body"><tspan x="865" dy="0">深度、跳数、并发、预算、幂等、循环检测与取消传播</tspan></text><text x="1755" y="1006" text-anchor="middle" class="body"><tspan x="1755" dy="0">超限返回A0</tspan></text><rect x="40" y="1071" width="210" height="123" fill="#FDECEC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="255" y="1071" width="585" height="123" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="845" y="1071" width="650" height="123" fill="#E6F6F4" stroke="#CBD5E1" stroke-width="1.2"/><rect x="1500" y="1071" width="510" height="123" fill="#EAF7EE" stroke="#CBD5E1" stroke-width="1.2"/><text x="145" y="1139" text-anchor="middle" class="name"><tspan x="145" dy="0">F1</tspan></text><text x="275" y="1125" text-anchor="start" class="body"><tspan x="275" dy="0">安全MCU或执行器控制链故障</tspan></text><text x="865" y="1113" text-anchor="start" class="body"><tspan x="865" dy="0">断扭矩、制动或安全停机；</tspan><tspan x="865" dy="21">只承诺安全失效</tspan></text><text x="1755" y="1129" text-anchor="middle" class="body"><tspan x="1755" dy="0">最坏反应时间达标</tspan></text><rect x="40" y="1194" width="210" height="123" fill="#FDECEC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="255" y="1194" width="585" height="123" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><rect x="845" y="1194" width="650" height="123" fill="#E6F6F4" stroke="#CBD5E1" stroke-width="1.2"/><rect x="1500" y="1194" width="510" height="123" fill="#EAF7EE" stroke="#CBD5E1" stroke-width="1.2"/><text x="145" y="1262" text-anchor="middle" class="name"><tspan x="145" dy="0">共同部署</tspan></text><text x="275" y="1248" text-anchor="start" class="body"><tspan x="275" dy="0">同一进程崩溃导致全部退出</tspan></text><text x="865" y="1236" text-anchor="start" class="body"><tspan x="865" dy="0">进程监督、重启、日志、故障域隔离；</tspan><tspan x="865" dy="21">F1独立硬安全域</tspan></text><text x="1755" y="1252" text-anchor="middle" class="body"><tspan x="1755" dy="0">单进程不承载全部逻辑</tspan></text><rect x="40" y="1335" width="1970" height="42" rx="8" fill="#FDECEC" stroke="#B94E56" stroke-width="1.5"/><text x="1025" y="1362" text-anchor="middle" class="body"><tspan x="1025" dy="0">否决条件：未授权物理动作、所有主要业务同时不可用、双Owner、不可发现的状态／契约污染，或故障扩散到无关业务。</tspan></text></svg>
