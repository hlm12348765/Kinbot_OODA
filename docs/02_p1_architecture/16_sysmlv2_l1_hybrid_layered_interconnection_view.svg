<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="4400" height="3100" viewBox="0 0 4400 3100" role="img" aria-labelledby="title desc">
  <title id="title">Kinbot L1 混合分层自治互连视图</title>
  <desc id="desc">当前架构的早期 L1 纵向分层表示：A0 集中跨领域语义与承诺，O3、C3、N3 和未来 OP3 按时间尺度形成领域闭环，ST3 提供交互与信息技能，AP3 提供运行支撑，G3 与 F1 分别实施语义授权和硬安全。该图仅用于追溯视图演进，不作为当前正式拓扑。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#4285F4"/></marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#B98618"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#38815B"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#C2413B"/></marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#637083"/></marker>
  </defs>
  <style>
    text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#182230}
    .title{font-size:42px;font-weight:600}.subtitle{font-size:24px;fill:#5A6573}.view{font-size:22px;fill:#45515F}
    .layer{font-size:27px;font-weight:600}.kind{font-size:19px;fill:#5A6573}.name{font-size:25px;font-weight:600}.id{font-size:24px;font-weight:700;fill:#FFFFFF}
    .body{font-size:20px}.small{font-size:18px;fill:#5A6573}.edge{font-size:17px;font-weight:500}
    .node{stroke-width:2.5}.lane{stroke-width:2}.flow{fill:none;stroke-width:3}.thin{fill:none;stroke-width:2.3}.dash{stroke-dasharray:12 9}
  </style>

  <rect width="4400" height="3100" fill="#F8FAFC"/>
  <text class="title" x="2200" y="60" text-anchor="middle">Kinbot L1 混合分层自治互连视图</text>
  <text class="subtitle" x="2200" y="103" text-anchor="middle">跨领域语义集中 · 必要领域局部闭环 · 语义授权与硬安全独立</text>
  <rect x="70" y="128" width="4260" height="52" rx="12" fill="#EEF2F7" stroke="#CBD4DE"/>
  <text class="view" x="95" y="162">view &lt;l1hiv&gt; 'L1混合分层互连视图' : InterconnectionView</text>

  <!-- 外部环境 -->
  <rect class="lane" x="80" y="210" width="4240" height="260" rx="22" fill="#F2F7FD" stroke="#7AA7D9"/>
  <text class="layer" x="140" y="255" fill="#315F93">外部环境</text>
  <rect class="node" x="1510" y="275" width="1380" height="145" rx="72" fill="#E8F0FE" stroke="#4285F4"/>
  <text class="kind" x="2200" y="307" text-anchor="middle">«part usage»</text>
  <text class="name" x="2200" y="348" text-anchor="middle">用户、信息系统与物理环境</text>
  <text class="body" x="2200" y="386" text-anchor="middle">语音、视觉、消息、服务、空间、物体与环境变化</text>

  <!-- 中枢编排 -->
  <rect class="lane" x="80" y="520" width="4240" height="340" rx="22" fill="#FFFBEB" stroke="#D5A526"/>
  <text class="layer" x="140" y="565" fill="#8A6410">跨领域编排层</text>
  <rect class="node" x="950" y="605" width="2500" height="190" rx="14" fill="#FFF1C9" stroke="#B98618"/>
  <rect x="980" y="625" width="96" height="54" rx="12" fill="#9A6B08"/>
  <text class="id" x="1028" y="662" text-anchor="middle">A0</text>
  <text class="kind" x="2200" y="638" text-anchor="middle">«part usage : AgentCell»</text>
  <text class="name" x="2200" y="680" text-anchor="middle">中枢编排 Agent</text>
  <line x1="950" y1="702" x2="3450" y2="702" stroke="#B98618"/>
  <text class="body" x="2200" y="738" text-anchor="middle"><tspan x="2200">根目标 · 跨领域计划 · 统一对话 · 优先级与中断恢复</tspan><tspan x="2200" dy="30">唯一主业务规划中心，统一语言承诺与实际行为</tspan></text>

  <!-- 领域闭环与技能 -->
  <rect class="lane" x="80" y="910" width="4240" height="760" rx="22" fill="#F2FBF5" stroke="#73B391"/>
  <text class="layer" x="140" y="955" fill="#38815B">领域闭环与技能层</text>
  <text class="small" x="4260" y="955" text-anchor="end">领域闭环对上提供受限能力接口，对内持续感知、判断、执行与恢复</text>

  <g>
    <rect class="node" x="140" y="1010" width="760" height="245" rx="14" fill="#DDF4E5" stroke="#38815B"/>
    <rect x="162" y="1028" width="84" height="52" rx="11" fill="#28704B"/>
    <text class="id" x="204" y="1064" text-anchor="middle">O3</text>
    <text class="kind" x="520" y="1043" text-anchor="middle">«part usage : StateLoop»</text>
    <text class="name" x="520" y="1084" text-anchor="middle">态势与状态闭环</text>
    <line x1="140" y1="1106" x2="900" y2="1106" stroke="#38815B"/>
    <text class="body" x="520" y="1142" text-anchor="middle"><tspan x="520">I1 → I2 → I3</tspan><tspan x="520" dy="30">共享状态语义 · 不确定性 · 证据</tspan><tspan x="520" dy="30">不创造业务目标</tspan></text>
  </g>

  <g>
    <rect class="node" x="980" y="1010" width="760" height="245" rx="14" fill="#DDF4E5" stroke="#38815B"/>
    <rect x="1002" y="1028" width="84" height="52" rx="11" fill="#28704B"/>
    <text class="id" x="1044" y="1064" text-anchor="middle">C3</text>
    <text class="kind" x="1360" y="1043" text-anchor="middle">«part usage : AgentCell»</text>
    <text class="name" x="1360" y="1084" text-anchor="middle">照护连续性 Agent</text>
    <line x1="980" y1="1106" x2="1740" y2="1106" stroke="#38815B"/>
    <text class="body" x="1360" y="1142" text-anchor="middle"><tspan x="1360">CareEvent · 用药与健康子目标</tspan><tspan x="1360" dy="30">提醒升级 · 服务跟踪 · 责任交接</tspan><tspan x="1360" dy="30">不取得根任务所有权</tspan></text>
  </g>

  <g>
    <rect class="node" x="1820" y="1010" width="760" height="245" rx="14" fill="#DDF4E5" stroke="#38815B"/>
    <rect x="1842" y="1028" width="84" height="52" rx="11" fill="#28704B"/>
    <text class="id" x="1884" y="1064" text-anchor="middle">N3</text>
    <text class="kind" x="2200" y="1043" text-anchor="middle">«part usage : PhysicalAgentCell»</text>
    <text class="name" x="2200" y="1084" text-anchor="middle">导航领域 Agent</text>
    <line x1="1820" y1="1106" x2="2580" y2="1106" stroke="#38815B"/>
    <text class="body" x="2200" y="1142" text-anchor="middle"><tspan x="2200">任务级导航目标 · 局部定位</tspan><tspan x="2200" dy="30">动态避障 · 重规划 · 到达验证</tspan><tspan x="2200" dy="30">不改变目的地和许可</tspan></text>
  </g>

  <g>
    <rect class="node" x="2660" y="1010" width="760" height="245" rx="14" fill="#EAF7ED" stroke="#38815B" stroke-dasharray="12 8"/>
    <rect x="2682" y="1028" width="100" height="52" rx="11" fill="#4D8766"/>
    <text class="id" x="2732" y="1064" text-anchor="middle">OP3</text>
    <text class="kind" x="3040" y="1043" text-anchor="middle">«part usage : FuturePhysicalAgentCell»</text>
    <text class="name" x="3040" y="1084" text-anchor="middle">操作领域 Agent（预留）</text>
    <line x1="2660" y1="1106" x2="3420" y2="1106" stroke="#38815B" stroke-dasharray="12 8"/>
    <text class="body" x="3040" y="1142" text-anchor="middle"><tspan x="3040">未来机械臂任务级目标</tspan><tspan x="3040" dy="30">力反馈修正 · 操作验证与恢复</tspan><tspan x="3040" dy="30">V1 不激活</tspan></text>
  </g>

  <g>
    <rect class="node" x="3500" y="1010" width="760" height="245" rx="14" fill="#E8F0FE" stroke="#4285F4"/>
    <rect x="3522" y="1028" width="100" height="52" rx="11" fill="#2F6FD0"/>
    <text class="id" x="3572" y="1064" text-anchor="middle">ST3</text>
    <text class="kind" x="3880" y="1043" text-anchor="middle">«part usage : SkillSystem»</text>
    <text class="name" x="3880" y="1084" text-anchor="middle">交互与信息技能系统</text>
    <line x1="3500" y1="1106" x2="4260" y2="1106" stroke="#4285F4"/>
    <text class="body" x="3880" y="1142" text-anchor="middle"><tspan x="3880">ASR/TTS · 屏幕与灯光</tspan><tspan x="3880" dy="30">消息 · 查询 · 受控连接器</tspan><tspan x="3880" dy="30">不决定内容、对象和目标</tspan></text>
  </g>

  <rect x="510" y="1370" width="3380" height="145" rx="12" fill="#EAF5EE" stroke="#9AC4AA"/>
  <text class="kind" x="2200" y="1402" text-anchor="middle">«interface contract»</text>
  <text class="body" x="2200" y="1440" text-anchor="middle">A0 下发目标、上下文、许可边界、预算和完成条件；领域返回状态变化、结果、置信度和失败证据</text>
  <text class="small" x="2200" y="1477" text-anchor="middle">默认不建立领域全连接；仅 N3—OP3 在同一复合任务合同内使用受限协调</text>

  <!-- 运行与治理 -->
  <rect class="lane" x="80" y="1720" width="4240" height="410" rx="22" fill="#F7F3FC" stroke="#9A7BB8"/>
  <text class="layer" x="140" y="1765" fill="#70518E">运行与语义治理层</text>
  <g>
    <rect class="node" x="310" y="1815" width="1760" height="225" rx="14" fill="#F0E8F8" stroke="#8A69A8"/>
    <rect x="336" y="1833" width="104" height="52" rx="11" fill="#755295"/>
    <text class="id" x="388" y="1869" text-anchor="middle">AP3</text>
    <text class="kind" x="1190" y="1848" text-anchor="middle">«part usage : RuntimePlatform»</text>
    <text class="name" x="1190" y="1889" text-anchor="middle">Agent 运行平台</text>
    <line x1="310" y1="1911" x2="2070" y2="1911" stroke="#8A69A8"/>
    <text class="body" x="1190" y="1947" text-anchor="middle"><tspan x="1190">任务 · 状态 · 记忆 · 事件 · 模型 · 技能 · 连接器</tspan><tspan x="1190" dy="30">资源 · 监测 · 版本 · 审计；不判断事实或生成目标</tspan></text>
  </g>
  <g>
    <rect class="node" x="2330" y="1815" width="1760" height="225" rx="14" fill="#FCE8E6" stroke="#C2413B"/>
    <rect x="2356" y="1833" width="84" height="52" rx="11" fill="#A4342F"/>
    <text class="id" x="2398" y="1869" text-anchor="middle">G3</text>
    <text class="kind" x="3210" y="1848" text-anchor="middle">«part usage : GovernanceSystem»</text>
    <text class="name" x="3210" y="1889" text-anchor="middle">语义治理与授权系统</text>
    <line x1="2330" y1="1911" x2="4090" y2="1911" stroke="#C2413B"/>
    <text class="body" x="3210" y="1947" text-anchor="middle"><tspan x="3210">身份 · 关系 · 权限 · 隐私 · 风险 · 紧急例外</tspan><tspan x="3210" dy="30">许可、拒绝、收紧、撤销与人工接管；不生成业务目标</tspan></text>
  </g>

  <!-- 硬安全 -->
  <rect class="lane" x="80" y="2180" width="4240" height="340" rx="22" fill="#FFF5F4" stroke="#D7807B"/>
  <text class="layer" x="140" y="2225" fill="#9D2F2A">机电与确定性硬实时安全层</text>
  <rect class="node" x="920" y="2270" width="2560" height="180" rx="14" fill="#FCE8E6" stroke="#C2413B"/>
  <rect x="948" y="2288" width="84" height="52" rx="11" fill="#A4342F"/>
