  <text class="kind" x="2200" y="2303" text-anchor="middle">«part usage : MechatronicSafetyPlatform»</text>
  <text class="name" x="2200" y="2344" text-anchor="middle">机电与硬安全平台 · Π_F1</text>
  <line x1="920" y1="2366" x2="3480" y2="2366" stroke="#C2413B"/>
