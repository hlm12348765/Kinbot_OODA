<path class="flow" d="M3020 1070 V1160 H2380 V1260" stroke="#6B57A5" marker-end="url(#arrow-purple)"/>
<path class="flow dash" d="M3320 515 H3480 V1480 H3200" stroke="#C2413B" marker-end="url(#arrow-red)"/>
<rect x="3282" y="975" width="168" height="34" rx="8" fill="#F8FAFC" opacity="0.94"/><text class="edge" x="3440" y="1000" text-anchor="end" fill="#C2413B">[拒绝或需确认]</text>
<path class="flow dash" d="M2690 1365 H2830 V1585 H2920" stroke="#C2413B" marker-end="url(#arrow-red)"/>
<rect x="2776.0" y="1395" width="168" height="34" rx="8" fill="#F8FAFC" opacity="0.94"/><text class="edge" x="2860" y="1420" text-anchor="middle" fill="#C2413B">[局部无法恢复]</text>
