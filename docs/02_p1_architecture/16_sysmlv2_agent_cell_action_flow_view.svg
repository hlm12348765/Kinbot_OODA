<path class="flow" d="M1530 515 H1620" stroke="#6B57A5" marker-end="url(#arrow-purple)"/>
<path class="flow" d="M2040 515 H2130" stroke="#6B57A5" marker-end="url(#arrow-purple)"/>
<g class="decision-node"><polygon points="3020,335 3320,515 3020,695 2720,515" fill="#FFF0E4" stroke="#C26A2E" stroke-width="2.6"/><text class="body" x="3020" y="503" text-anchor="middle"><tspan x="3020" dy="0">本地检查</tspan><tspan x="3020" dy="28">/</tspan><tspan x="3020" dy="28">系统许可</tspan></text></g>
<path class="flow" d="M2550 515 H2720" stroke="#6B57A5" marker-end="url(#arrow-purple)"/>
<g class="action-node"><rect class="node" x="2710" y="880" width="620" height="190" rx="28" fill="#DDF4E5" stroke="#38815B"/><text class="kind" x="3020.0" y="914" text-anchor="middle">«action»</text><text class="name" x="3020.0" y="956" text-anchor="middle">调用技能与工具</text><text class="small" x="3020.0" y="992" text-anchor="middle"><tspan x="3020.0" dy="0">确定性执行与外部作用</tspan></text></g>
<g class="action-node"><rect class="node" x="2070" y="1260" width="620" height="210" rx="28" fill="#E9E1FF" stroke="#6B57A5"/><text class="kind" x="2380.0" y="1294" text-anchor="middle">«action»</text><text class="name" x="2380.0" y="1336" text-anchor="middle">验证结果与记录证据</text><text class="small" x="2380.0" y="1372" text-anchor="middle"><tspan x="2380.0" dy="0">完成判据、反馈、状态版本</tspan></text></g>
<g class="action-node"><rect class="node" x="2920" y="1480" width="560" height="210" rx="28" fill="#FFF0E4" stroke="#C26A2E"/><text class="kind" x="3200.0" y="1514" text-anchor="middle">«action»</text><text class="name" x="3200.0" y="1556" text-anchor="middle">降级、澄清或升级</text><text class="small" x="3200.0" y="1592" text-anchor="middle"><tspan x="3200.0" dy="0">拒绝、确认或局部无法恢复</tspan></text></g>
<g class="action-node"><rect class="node" x="1110" y="1640" width="620" height="210" rx="28" fill="#DDF4E5" stroke="#38815B"/><text class="kind" x="1420.0" y="1674" text-anchor="middle">«action»</text><text class="name" x="1420.0" y="1716" text-anchor="middle">提交状态与结果</text><text class="small" x="1420.0" y="1752" text-anchor="middle"><tspan x="1420.0" dy="0">返回父目标责任方</tspan></text></g>
<path class="flow" d="M3020 695 V880" stroke="#38815B" marker-end="url(#arrow-green)"/>
