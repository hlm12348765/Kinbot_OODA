<g class="action-node"><rect class="node" x="600" y="420" width="420" height="190" rx="28" fill="#E9E1FF" stroke="#6B57A5"/><text class="kind" x="810.0" y="454" text-anchor="middle">«action»</text><text class="name" x="810.0" y="496" text-anchor="middle">观察局部环境与自身状态</text></g>
