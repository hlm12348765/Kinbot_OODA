<rect x="1815.0" y="1310" width="130" height="34" rx="8" fill="#F8FAFC" opacity="0.94"/><text class="edge" x="1880" y="1335" text-anchor="middle" fill="#38815B">[完成]</text>
<path class="flow" d="M2200 1470 V1940 H810 V610" stroke="#6B57A5" marker-end="url(#arrow-purple)"/>
<rect x="1375.0" y="1885" width="210" height="34" rx="8" fill="#F8FAFC" opacity="0.94"/><text class="edge" x="1480" y="1910" text-anchor="middle" fill="#6B57A5">[未完成且预算允许]</text>
<line x1="70" y1="2108" x2="3530" y2="2108" stroke="#D7DEE6"/>
<text class="small" x="1800.0" y="2150" text-anchor="middle">箭头表示 succession；方括号文字是 guard。决策节点负责分支，不代表新增 Agent 或同步中心。</text>
</svg>