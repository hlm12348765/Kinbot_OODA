<g class="action-node"><rect class="node" x="1620" y="420" width="420" height="190" rx="28" fill="#E9E1FF" stroke="#6B57A5"/><text class="kind" x="1830.0" y="454" text-anchor="middle">«action»</text><text class="name" x="1830.0" y="496" text-anchor="middle">选择模型、策略和技能</text></g>
<g class="action-node"><rect class="node" x="2130" y="420" width="420" height="190" rx="28" fill="#E9E1FF" stroke="#6B57A5"/><text class="kind" x="2340.0" y="454" text-anchor="middle">«action»</text><text class="name" x="2340.0" y="496" text-anchor="middle">形成行动申请</text></g>
