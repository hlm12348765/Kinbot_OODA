<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Kinbot Agentic Robot System：过程—操作数匹配</title>
  <desc id="desc">SysML v2 风格总图，展示八个信息过程和五个物理过程与操作数的输入输出关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#46515c"/>
    </marker>
    <style>
      .canvas { fill: #f7f8fa; }
      .panel { fill: #ffffff; stroke: #9aa5b1; stroke-width: 2; rx: 20; }
      .panel-title { font: 700 34px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17212b; }
      .column-title { font: 600 22px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5b6672; letter-spacing: 1px; }
      .title { font: 700 48px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111820; }
      .subtitle { font: 500 22px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5f6b76; }
      .stereo { font: 500 18px "SFMono-Regular", Menlo, Consolas, monospace; fill: #5d6670; text-anchor: middle; }
      .node-label { font: 600 25px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17212b; text-anchor: middle; }
      .chip-label { font: 600 21px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17212b; text-anchor: middle; }
      .process { fill: #fff2cc; stroke: #946200; stroke-width: 2; rx: 18; }
      .info { fill: #eaf2ff; stroke: #2457a6; stroke-width: 2; rx: 6; }
      .physical { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
      .flow { stroke: #46515c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .separator { stroke: #e3e7eb; stroke-width: 1.5; }
      .legend-label { font: 500 20px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #303a44; }
      .footer { font: 500 20px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #65717d; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="3200" height="1800"/>

  <text class="title" x="60" y="72">Kinbot Agentic Robot System：过程—操作数匹配</text>
  <text class="subtitle" x="62" y="112">view «SysML v2» · Process–Operand Object Flow</text>

  <g aria-label="图例">
    <rect class="process" x="2260" y="38" width="90" height="38"/>
    <text class="legend-label" x="2365" y="64">黄色：过程</text>
    <rect class="info" x="2535" y="38" width="90" height="38"/>
    <text class="legend-label" x="2640" y="64">蓝色：信息操作数</text>
    <rect class="physical" x="2860" y="38" width="90" height="38"/>
    <text class="legend-label" x="2965" y="64">绿色：物理操作数</text>
    <line class="flow" x1="2260" y1="100" x2="2350" y2="100"/>
    <text class="legend-label" x="2365" y="107">箭头：对象流</text>
  </g>

