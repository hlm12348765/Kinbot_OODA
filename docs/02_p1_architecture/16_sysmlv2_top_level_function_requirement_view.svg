<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1500" viewBox="0 0 3200 1500" role="img" aria-labelledby="title desc">
<title id="title">Kinbot 系统顶层功能视图</title>
<desc id="desc">从问题状态到目标状态的系统转换，以及必须始终满足的约束</desc>
<defs>
<marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#2F6FDD"/></marker>
<marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#6B57A5"/></marker>
<marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#38815B"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#D97706"/></marker>
<marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#C2413B"/></marker>
<marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#0F766E"/></marker>
<marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L11,5 z" fill="#5A6573"/></marker>
</defs>
<style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#182230}
.title{font-size:42px;font-weight:500}.subtitle{font-size:24px;fill:#5A6573}
.view{font-size:22px;fill:#45515F}.zone{font-size:28px;font-weight:500}
.kind{font-size:20px;fill:#5A6573}.name{font-size:27px;font-weight:500}
.body{font-size:22px}.small{font-size:19px;fill:#5A6573}.edge{font-size:20px;font-weight:500}
.node{stroke-width:2.4}.lane{stroke-width:2}.flow{fill:none;stroke-width:3.4}
.thin{fill:none;stroke-width:2.2}.dash{stroke-dasharray:12 9}
.lifeline{stroke:#98A3AF;stroke-width:2.2;stroke-dasharray:9 9}
.activation{fill:#E9E1FF;stroke:#6B57A5;stroke-width:2}
</style>
<rect width="3200" height="1500" fill="#F8FAFC"/>
<text class="title" x="1600.0" y="62" text-anchor="middle">Kinbot 系统顶层功能视图</text>
<text class="subtitle" x="1600.0" y="105" text-anchor="middle">从问题状态到目标状态的系统转换，以及必须始终满足的约束</text>
<rect x="70" y="132" width="3060" height="52" rx="12" fill="#EEF2F7" stroke="#CBD4DE"/>
<text class="view" x="95" y="166">view &lt;tfrv&gt; &#x27;系统顶层功能需求视图&#x27; : GeneralView（需求与定义专题化）</text>
<g class="model-node"><rect class="node" x="140" y="330" width="700" height="350" rx="8" fill="#DDEEFF" stroke="#3B6EA8"/><text class="kind" x="490.0" y="364" text-anchor="middle">«item def»</text><text class="name" x="490.0" y="408" text-anchor="middle">&lt;G&gt; 问题状态</text><line x1="140" y1="428" x2="840" y2="428" stroke="#3B6EA8" stroke-width="1.5"/><text class="body" x="490.0" y="462" text-anchor="middle"><tspan x="490.0" dy="0">老人家庭生活与照护</tspan><tspan x="490.0" dy="31">可能断联、失序或中断</tspan></text></g>
<g class="action-node"><rect class="node" x="1150" y="330" width="900" height="350" rx="28" fill="#E9E1FF" stroke="#6B57A5"/><text class="kind" x="1600.0" y="364" text-anchor="middle">«action»</text><text class="name" x="1600.0" y="406" text-anchor="middle">&lt;F-01&gt; 持续转化并维持</text><text class="small" x="1600.0" y="442" text-anchor="middle"><tspan x="1600.0" dy="0">执行主体：Kinbot Agentic Robot System</tspan><tspan x="1600.0" dy="27">完成条件：生活连续性能够被验证</tspan></text></g>
<g class="model-node"><rect class="node" x="2360" y="300" width="700" height="410" rx="8" fill="#DDF4E5" stroke="#38815B"/><text class="kind" x="2710.0" y="334" text-anchor="middle">«item def»</text><text class="name" x="2710.0" y="378" text-anchor="middle">&lt;O&gt; 目标状态</text><line x1="2360" y1="398" x2="3060" y2="398" stroke="#38815B" stroke-width="1.5"/><text class="body" x="2710.0" y="432" text-anchor="middle"><tspan x="2710.0" dy="0">可感知</tspan><tspan x="2710.0" dy="31">可理解</tspan><tspan x="2710.0" dy="31">可响应</tspan><tspan x="2710.0" dy="31">可恢复</tspan><tspan x="2710.0" dy="31">可交接</tspan></text></g>
<path class="flow" d="M840 505 H1150" stroke="#2F6FDD" marker-end="url(#arrow-blue)"/>
<path class="flow" d="M2050 505 H2360" stroke="#38815B" marker-end="url(#arrow-green)"/>
<rect x="930.0" y="455" width="130" height="34" rx="8" fill="#F8FAFC" opacity="0.94"/><text class="edge" x="995" y="480" text-anchor="middle" fill="#26313D">输入</text>
<rect x="2131.5" y="455" width="147" height="34" rx="8" fill="#F8FAFC" opacity="0.94"/><text class="edge" x="2205" y="480" text-anchor="middle" fill="#26313D">持续产生并维持</text>
<g class="model-node"><rect class="node" x="120" y="930" width="480" height="230" rx="8" fill="#FFF0E4" stroke="#C26A2E"/><text class="kind" x="360.0" y="964" text-anchor="middle">«requirement def»</text><text class="name" x="360.0" y="1008" text-anchor="middle">&lt;C1&gt; 安全</text><line x1="120" y1="1028" x2="600" y2="1028" stroke="#C26A2E" stroke-width="1.5"/><text class="body" x="360.0" y="1062" text-anchor="middle"><tspan x="360.0" dy="0">约束系统转换与维持过程</tspan></text></g>
<path class="thin dash" d="M360 930 V820 H1270 V680" stroke="#C2413B" marker-end="url(#arrow-red)"/>
<g class="model-node"><rect class="node" x="740" y="930" width="480" height="230" rx="8" fill="#FFF0E4" stroke="#C26A2E"/><text class="kind" x="980.0" y="964" text-anchor="middle">«requirement def»</text><text class="name" x="980.0" y="1008" text-anchor="middle">&lt;C2&gt; 合规</text><line x1="740" y1="1028" x2="1220" y2="1028" stroke="#C26A2E" stroke-width="1.5"/><text class="body" x="980.0" y="1062" text-anchor="middle"><tspan x="980.0" dy="0">约束系统转换与维持过程</tspan></text></g>
<path class="thin dash" d="M980 930 V820 H1425 V680" stroke="#C2413B" marker-end="url(#arrow-red)"/>
<g class="model-node"><rect class="node" x="1360" y="930" width="480" height="230" rx="8" fill="#FFF0E4" stroke="#C26A2E"/><text class="kind" x="1600.0" y="964" text-anchor="middle">«requirement def»</text><text class="name" x="1600.0" y="1008" text-anchor="middle">&lt;C3&gt; 授权</text><line x1="1360" y1="1028" x2="1840" y2="1028" stroke="#C26A2E" stroke-width="1.5"/><text class="body" x="1600.0" y="1062" text-anchor="middle"><tspan x="1600.0" dy="0">约束系统转换与维持过程</tspan></text></g>
<path class="thin dash" d="M1600 930 V820 H1600 V680" stroke="#C2413B" marker-end="url(#arrow-red)"/>
<g class="model-node"><rect class="node" x="1980" y="930" width="480" height="230" rx="8" fill="#FFF0E4" stroke="#C26A2E"/><text class="kind" x="2220.0" y="964" text-anchor="middle">«requirement def»</text><text class="name" x="2220.0" y="1008" text-anchor="middle">&lt;C4&gt; 资源</text><line x1="1980" y1="1028" x2="2460" y2="1028" stroke="#C26A2E" stroke-width="1.5"/><text class="body" x="2220.0" y="1062" text-anchor="middle"><tspan x="2220.0" dy="0">约束系统转换与维持过程</tspan></text></g>
<path class="thin dash" d="M2220 930 V820 H1775 V680" stroke="#C2413B" marker-end="url(#arrow-red)"/>
<g class="model-node"><rect class="node" x="2600" y="930" width="480" height="230" rx="8" fill="#FFF0E4" stroke="#C26A2E"/><text class="kind" x="2840.0" y="964" text-anchor="middle">«requirement def»</text><text class="name" x="2840.0" y="1008" text-anchor="middle">&lt;C5&gt; 低打扰</text><line x1="2600" y1="1028" x2="3080" y2="1028" stroke="#C26A2E" stroke-width="1.5"/><text class="body" x="2840.0" y="1062" text-anchor="middle"><tspan x="2840.0" dy="0">约束系统转换与维持过程</tspan></text></g>
<path class="thin dash" d="M2840 930 V820 H1930 V680" stroke="#C2413B" marker-end="url(#arrow-red)"/>
<line x1="70" y1="1408" x2="3130" y2="1408" stroke="#D7DEE6"/>
<text class="small" x="1600.0" y="1450" text-anchor="middle">蓝/绿实线表示系统转换；红色虚线表示约束作用。该图不表示实现顺序。</text>
</svg>